<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Dino Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
    <div id="score">Score: 0</div>
    <div id="dino"></div>
    <div id="ground"></div>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="restartGame()">Play Again</button>
</div>

<audio id="jumpSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>

<audio id="bgMusic" loop>
    <source src="https://actions.google.com/sounds/v1/ambiences/bird_forest_ambience.ogg">
</audio>

<script src="script.js"></script>
</body>
</html>
